version: "1.0.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Mass-edit user settings, permissions, and defaults for Jellyfin."
description: "Allows administrators to bulk-update library order, playback, subtitle, and permission settings for multiple users, define defaults for newly created accounts, and back up or restore every user's configuration."
category: "Administration"
owner: "jnracreates"
artifacts:
  - "Jellyfin.Plugin.BulkUserManager.dll"
changelog: |
  ## 1.0.0.0
  - Initial release
  - Mass edit user settings: library order, playback, subtitles
  - Mass edit user permissions: account flags, library access, feature toggles
  - Defaults for new users applied via scheduled task
  - Full backup and restore of all user configurations
